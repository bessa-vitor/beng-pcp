// Status automático a partir dos dias marcados
function autoStatus(t) {
  const planned = t.dias.filter(v => v !== null);
  const allOk = planned.length > 0 && planned.every(v => v === 'ok');
  const anyMark = planned.some(v => v === 'ok' || v === 'x');
  if (allOk) { t.status = 'concluida'; t.causa = ''; return; }
  if (t.status === 'concluida') t.status = 'andamento';
  if (t.causa) { t.status = 'impedida'; return; }
  if (anyMark && t.status === 'nao_iniciada') t.status = 'andamento';
  if (t.status === 'impedida' && !t.causa) t.status = anyMark ? 'andamento' : 'nao_iniciada';
}

// ---------------------------- Avanço do PMP (automático pelo PCP) --------
// Dias de trabalho entre a e b (inclusive), respeitando sábado/domingo das preferências
function diasUteis(a, b, prefs = state.prefs) {
  let n = 0;
  for (let d = new Date(a.getFullYear(), a.getMonth(), a.getDate()); d <= b; d.setDate(d.getDate() + 1)) {
    const w = d.getDay();
    if ((w >= 1 && w <= 5) || (w === 6 && prefs.sabado) || (w === 0 && prefs.domingo)) n++;
  }
  return n;
}
// Previsto: proporção de dias úteis decorridos até a data `ate`
function previstoPMP(p, ate) {
  const a = fromKey(p.inicio), b = fromKey(p.fim);
  if (ate < a) return 0;
  if (ate >= b) return 100;
  return Math.round(diasUteis(a, ate) / Math.max(1, diasUteis(a, b)) * 100);
}
// Realizado: avanço base (importado/informado em `baseData`) + dias executados (✓) no PCP depois dessa data.
// O que faltava na data-base é distribuído pelos dias úteis restantes da etapa.
function realPMP(p, ate = null) {
  const base = Math.max(0, Math.min(100, Number(p.progresso || 0)));
  const a = fromKey(p.inicio), b = fromKey(p.fim);
  const baseD = fromKey(p.baseData || p.inicio);
  if (ate && ate < baseD) {   // antes da data-base: interpola linearmente até o valor base
    if (ate < a) return 0;
    return Math.round(base * Math.min(1, diasUteis(a, ate) / Math.max(1, diasUteis(a, baseD))));
  }
  if (p.manual || base >= 100) return base;
  let ok = 0, planejados = 0;
  for (const t of tarefasDoPmp(p.id)) {
    const s = fromKey(t.semana);
    t.dias.forEach((v, i) => {
      if (v === null) return;
      const d = addDays(s, i);
      if (d < baseD) return;
      if (t.roladaPara && v !== 'ok') return;   // o que sobrou foi para a semana seguinte
      planejados++;
      if (v === 'ok' && (!ate || d <= ate)) ok++;
    });
  }
  const restantes = Math.max(1, diasUteis(baseD > a ? baseD : a, b), planejados);
  return Math.min(100, Math.round(base + (100 - base) * ok / restantes));
}
// Índice tarefas-por-etapa (refeito a cada render)
let PMP_IDX = null;
function tarefasDoPmp(id) {
  if (!PMP_IDX) { PMP_IDX = new Map(); for (const t of state.tarefas) if (t.pmpId) { if (!PMP_IDX.has(t.pmpId)) PMP_IDX.set(t.pmpId, []); PMP_IDX.get(t.pmpId).push(t); } }
  return PMP_IDX.get(id) || [];
}
function avancoPMP(p) {
  const hoje = fromKey(todayKey());
  const real = realPMP(p), previsto = previstoPMP(p, hoje);
  const atrasada = real < 100 && (p.fim < todayKey() || real < previsto - 10);
  return { real, previsto, atrasada, desvio: real - previsto };
}
// Curva S da obra: médias ponderadas pela duração (dias úteis) de cada etapa
function curvaS(itens) {
  if (!itens.length) return [];
  const s0 = sundayOf(fromKey(itens.reduce((m, i) => i.inicio < m ? i.inicio : m, itens[0].inicio)));
  const fimMax = fromKey(itens.reduce((m, i) => i.fim > m ? i.fim : m, itens[0].fim));
  const pesos = itens.map(p => Math.max(1, diasUteis(fromKey(p.inicio), fromKey(p.fim))));
  const somaPeso = pesos.reduce((a, b) => a + b, 0);
  const hoje = fromKey(todayKey());
  const pts = [];
  for (let w = s0; w <= addDays(fimMax, 6); w = addDays(w, 7)) {
    const fimSemana = addDays(w, 6);
    const prev = itens.reduce((a, p, i) => a + previstoPMP(p, fimSemana) * pesos[i], 0) / somaPeso;
    const ateReal = fimSemana > hoje ? hoje : fimSemana;
    const real = w <= hoje ? itens.reduce((a, p, i) => a + realPMP(p, ateReal) * pesos[i], 0) / somaPeso : null;
    pts.push({ w: toKey(w), prev: Math.round(prev * 10) / 10, real: real === null ? null : Math.round(real * 10) / 10 });
  }
  return pts;
}

// ---------------------------- Toast --------------------------------------
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.remove('hidden'); el.classList.add('fade-in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

// ---------------------------- Render: shell ------------------------------
function renderSync() {
  const st = $('#sync-status'), dot = $('#sync-dot');
  document.body.classList.toggle('role-enc', !isGestor());
  if (!Cloud.enabled) {
    st.innerHTML = `<div class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-amber-400"></span> Modo local — só neste aparelho</div>
      <div class="mt-1">Ative a nuvem em <b class="text-white/70">Cadastros</b>.</div>`;
    dot.className = 'h-2.5 w-2.5 rounded-full shrink-0 bg-amber-400'; dot.title = 'Modo local';
    return;
  }
  const off = !navigator.onLine;
  const [cor, txt] = off ? ['bg-slate-400', 'Offline — alterações serão enviadas'] : Cloud.pending ? ['bg-amber-400', 'Enviando alterações…'] : ['bg-emerald-400', 'Sincronizado'];
  const papel = { gestor: 'Gestor', encarregado: 'Encarregado' }[Cloud.profile?.papel] || '';
  st.innerHTML = `<div class="flex items-center gap-2"><span class="h-2 w-2 rounded-full ${cor}"></span> ${txt}</div>
    ${Cloud.profile ? `<div class="mt-1 truncate"><b class="text-white/80">${esc(Cloud.profile.nome)}</b> · ${papel}</div>` : ''}`;
  dot.className = `h-2.5 w-2.5 rounded-full shrink-0 ${cor}`; dot.title = txt;
}

function renderShell() {
  renderSync();
  const opts = obrasVisiveis().map(o => `<option class="text-slate-800" value="${o.id}" ${o.id === state.obraAtiva ? 'selected' : ''}>${esc(o.nome)}</option>`).join('')
    || '<option class="text-slate-800" value="">Nenhuma obra</option>';
  $('#obra-select-desktop').innerHTML = opts;
  $('#obra-select-mobile').innerHTML = opts;

  $('#nav-desktop').innerHTML = NAV.map(n => {
    const act = ui.view === n.id;
    return `<button data-action="nav" data-view="${n.id}" class="w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-left transition ${act ? 'bg-gold text-white shadow-lg' : 'text-white/75 hover:bg-white/10 hover:text-white'}">
      ${n.icon}<span class="flex-1"><span class="block text-sm font-semibold leading-tight">${n.label}</span><span class="block text-[11px] ${act ? 'text-white/80' : 'text-white/45'}">${n.sub}</span></span>
      ${act ? '<span class="h-1.5 w-1.5 rounded-full bg-white"></span>' : ''}</button>`;
  }).join('');

  $('#nav-mobile').innerHTML = NAV.map(n => {
    const act = ui.view === n.id;
    return `<button data-action="nav" data-view="${n.id}" class="flex flex-col items-center justify-center gap-0.5 py-2.5 ${act ? 'text-brand' : 'text-slate-400'}">
      ${n.icon}<span class="text-[11px] font-semibold">${n.label}</span>${act ? '<span class="h-1 w-6 rounded-full bg-gold mt-0.5"></span>' : '<span class="h-1 w-6 mt-0.5"></span>'}</button>`;
  }).join('');

  $('#fab').classList.toggle('hidden', !(ui.view === 'pcp' || ui.view === 'pmp'));
}

function render() {
  ui.pendingRender = false; PMP_IDX = null;
  renderShell();
  if (Cloud.enabled && !Cloud.ready) return;
  const main = $('#main');
  if (!obraAtual() && ui.view !== 'cfg') { main.innerHTML = emptyObra(); return; }
  if (ui.view === 'pcp') main.innerHTML = viewPCP();
  else if (ui.view === 'pmp') main.innerHTML = viewPMP();
  else if (ui.view === 'ind') main.innerHTML = viewIND();
  else main.innerHTML = viewCFG();
  if (ui.highlight) {
    const id = ui.highlight; ui.highlight = null;
    requestAnimationFrame(() => {
      const el = document.querySelector(`[data-card="${id}"]`);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    });
  }
}

function pageHeader(title, subtitle, right = '') {
  return `<div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div><h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900">${title}</h1>
    <p class="text-sm text-slate-500">${subtitle}</p></div>${right}</div>`;
}

// ---------------------------- VIEW: PCP ----------------------------------
function viewPCP() {
  const all = tarefasSemana();
  const list = aplicaFiltros(all);
  const obra = obraAtual();
  const isAtual = ui.week === currentWeek();
  const p = ppc(all);
  const planejadas = all.filter(t => !t.naoPlanejada);
  const nConc = planejadas.filter(t => t.status === 'concluida').length;
  const nNP = all.length - planejadas.length;
  const nNPpend = all.filter(t => t.naoPlanejada && t.aprovacao === 'pendente').length;
  const nImp = all.filter(t => t.status === 'impedida').length;
  const nMatPend = all.reduce((a, t) => a + (t.materiais || []).filter(m => !m.ok).length, 0);
  const fAtivos = Object.entries(ui.filters).filter(([k, v]) => v).length;

  const base = tarefasObra();
  const opt = (field) => uniq(base.map(t => t[field]));
  const sel = (field, label, options, labeler = v => v) => `
    <label class="block"><span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${label}</span>
    <select data-filter="${field}" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-gold focus:ring-2 focus:ring-gold/20 outline-none">
      <option value="">Todos</option>${options.map(o => `<option value="${esc(o)}" ${ui.filters[field] === o ? 'selected' : ''}>${esc(labeler(o))}</option>`).join('')}

  const semanaNav = `

      <button data-action="week-today" class="flex items-center gap-2 px-2 py-1 text-sm font-semibold text-slate-700" title="Voltar para semana atual">
        ${ICON.cal}<span>${weekLabel(ui.week)}</span>
        ${isAtual ? '<span class="rounded-md bg-emerald-500 text-white text-[10px] font-bold px-1.5 py-0.5">ATUAL</span>' : ''}

  let box;
  if (v === null) {
    box = `<div class="${sz} rounded-md bg-slate-50 border border-dashed border-slate-200"></div>`;
  } else {
    const cls = v === 'ok' ? 'bg-emerald-500 border-emerald-500 text-white'

    const tip = v === 'ok' ? 'Executado' : v === 'x' ? 'Não executado' : 'Planejado — toque para marcar';

  return `<div class="flex flex-col items-center gap-1">

function seloTarefa(t) {
  const out = [];
  if (t.naoPlanejada) out.push(`<span class="inline-flex items-center rounded bg-violet-100 text-violet-700 text-[10px] font-bold px-1.5 py-0.5">NÃO PLANEJADO${t.aprovacao === 'pendente' ? ' · AGUARDANDO APROVAÇÃO' : ''}</span>`);
  if (t.rolagens) out.push(`<span class="inline-flex items-center rounded bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5" title="Não foi concluída na semana planejada e foi trazida automaticamente">↩ PENDENTE DESDE ${fmtDM(fromKey(t.origemSemana || t.semana))}${t.rolagens > 1 ? ` · ${t.rolagens}× REPROGRAMADA` : ''}</span>`);
  if (t.roladaPara) out.push(`<span class="inline-flex items-center rounded bg-slate-100 text-slate-500 text-[10px] font-bold px-1.5 py-0.5">↪ REPROGRAMADA P/ SEMANA ${fmtDM(fromKey(t.roladaPara))}</span>`);
  return out.length ? `<div class="mt-1 flex flex-wrap gap-1">${out.join('')}</div>` : '';
}

// Planeja n dias de trabalho na semana (a partir do índice `de`), respeitando sábado/domingo
function planejarDias(de, n) {
  const dias = Array(7).fill(null); let c = 0;
  for (let i = de; i < 7 && c < n; i++) {
    const util = (i >= 1 && i <= 5) || (i === 6 && state.prefs.sabado) || (i === 0 && state.prefs.domingo);
    if (util || i === de) { dias[i] = 'p'; c++; }
  }
  return dias;
}

// ---------------------------- Rolagem automática de pendências ------------
// Na virada da semana, o que não foi concluído vai sozinho para a semana atual.
// A tarefa original fica na semana dela (conta no PPC daquela semana) marcada como "reprogramada".
function autoRolar() {
  if (!isGestor() || state.prefs.rolagemAuto === false || !obraAtual()) return 0;
  if (Cloud.enabled && !Cloud.ready) return 0;
  const cur = currentWeek(), limite = toKey(addDays(fromKey(cur), -56));
  const cand = tarefasObra().filter(t => t.semana < cur && t.semana >= limite && t.status !== 'concluida' && !t.roladaPara && !t.naoPlanejada);
  if (!cand.length) return 0;
  const existentes = new Set(tarefasSemana(cur).map(t => norm(t.titulo)));
  // semanas em que cada serviço aparece (para saber se já foi replanejado à mão)
  const semanasPorNome = new Map();
  tarefasObra().forEach(t => { const k = norm(t.titulo); if (!semanasPorNome.has(k)) semanasPorNome.set(k, []); semanasPorNome.get(k).push(t.semana); });
  let n = 0;
  cand.sort((a, b) => a.semana.localeCompare(b.semana)).forEach(t => {
    const k = norm(t.titulo);
    const depois = (semanasPorNome.get(k) || []).filter(w => w > t.semana && w <= cur).sort()[0];
    t.roladaPara = depois || cur;
    if (depois || existentes.has(k)) return;       // já foi replanejada numa semana seguinte
    const restante = Math.max(1, t.dias.filter(v => v === 'p' || v === 'x').length);
    const c = copyTaskTo(t, cur);
    c.id = t.id + '-r' + cur.replace(/-/g, '');   // id fixo: evita duplicar se dois gestores abrirem juntos
    c.dias = planejarDias(1, restante);
    c.origemSemana = t.origemSemana || t.semana;
    c.rolagens = (t.rolagens || 0) + 1;
    c.roladaPara = ''; c.antecipadaDe = ''; c.causa = ''; c.status = 'nao_iniciada';
    state.tarefas.push(c); existentes.add(k); n++;
  });
  save();
  return n;
}
function checarRolagem() {
  const n = autoRolar();
  if (n) { render(); toast(`${n} pendência${n > 1 ? 's' : ''} da semana anterior ${n > 1 ? 'foram trazidas' : 'foi trazida'} para esta semana`); }
}

// ---------------------------- Antecipar p/ hoje ---------------------------
function btnAntecipar(t, compact = false) {
  if (t.status === 'concluida' || t.roladaPara || (t.naoPlanejada && t.aprovacao === 'pendente')) return '';
  const cur = currentWeek();
  if (t.semana === cur) return '';
  const fut = t.semana > cur;
  const label = fut ? '⚡ Antecipar p/ hoje' : '↩ Trazer p/ hoje';
  const tip = fut ? 'Move esta tarefa para a semana atual, começando hoje' : 'Cria uma cópia desta pendência na semana atual, começando hoje (o histórico desta semana fica preservado)';
  return `<button data-action="antecipar" data-id="${t.id}" title="${tip}" class="no-print ${compact ? '' : 'mt-2'} inline-flex items-center gap-1 rounded-full border border-gold/40 bg-gold-light px-2.5 py-1 text-[11px] font-bold text-gold-dark hover:bg-gold hover:text-white whitespace-nowrap transition">${label}</button>`;
}
function anteciparHoje(id) {
  const t = findTask(id); if (!t) return;
  const cur = currentWeek(), hoje = new Date(), hi = hoje.getDay();
  const fut = t.semana > cur;
  const diaTxt = `${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][hi]} ${fmtDM(hoje)}`;
  if (!confirm(`${fut ? 'Antecipar' : 'Trazer'} "${t.titulo}" da semana ${weekLabel(t.semana)} para hoje (${diaTxt})?`)) return;
  const dup = tarefasSemana(cur).find(x => x.id !== t.id && norm(x.titulo) === norm(t.titulo));
  if (dup && !confirm(`Já existe "${dup.titulo}" na semana atual. Continuar mesmo assim?`)) return;
  // Replaneja a mesma quantidade de dias, a partir de hoje, nos dias de trabalho da semana
  const n = Math.max(1, t.dias.filter(v => v !== null).length);
  const dias = Array(7).fill(null); let c = 0;
  for (let i = hi; i < 7 && c < n; i++) {
    const util = (i >= 1 && i <= 5) || (i === 6 && state.prefs.sabado) || (i === 0 && state.prefs.domingo);
    if (i === hi || util) { dias[i] = 'p'; c++; }
  }
  let alvo = t;
  if (fut) { t.antecipadaDe = t.semana; t.semana = cur; t.dias = dias; if (t.status === 'impedida' && !t.causa) t.status = 'nao_iniciada'; }
  else { alvo = copyTaskTo(t, cur); alvo.dias = dias; alvo.antecipadaDe = ''; state.tarefas.push(alvo); }
  // Etapa do PMP que ainda não tinha começado passa a começar hoje
  let ajustou = false;
  const pm = t.pmpId && state.pmp.find(p => p.id === t.pmpId);
  if (pm && pm.inicio > todayKey()) { pm.inicio = todayKey(); if (pm.fim < pm.inicio) pm.fim = pm.inicio; ajustou = true; }
  save();
  closeModal();
  ui.view = 'pcp'; ui.week = cur; ui.highlight = alvo.id;
  Object.keys(ui.filters).forEach(k => ui.filters[k] = '');
  render();
  toast(`${fut ? 'Antecipada' : 'Trazida'} para hoje ✓${ajustou ? ' · início da etapa no PMP ajustado' : ''}`);
}

// ---------------------------- Busca rápida (todas as semanas) ------------
function buscaServicos(q, soPendentes) {
  const toks = norm(q).split(' ').filter(Boolean);
  if (!toks.length) return { tarefas: [], pmp: [] };
  const casa = txt => { const n = norm(txt); return toks.every(k => n.includes(k)); };
  const cur = currentWeek();
  const tarefas = tarefasObra().filter(t =>
    (!soPendentes || t.status !== 'concluida') &&
    casa([t.titulo, t.setor, t.disciplina, t.executante, t.responsavel, t.encarregado, t.obs, t.causa, (t.materiais || []).map(m => m.nome).join(' ')].join(' '))
  ).sort((a, b) => {
    const ra = a.semana === cur ? 0 : a.semana > cur ? 1 : 2, rb = b.semana === cur ? 0 : b.semana > cur ? 1 : 2;
    if (ra !== rb) return ra - rb;
    return ra === 2 ? b.semana.localeCompare(a.semana) : a.semana.localeCompare(b.semana);
  });
  const pmp = pmpObra().filter(p => casa([p.etapa, p.setor, p.disciplina, p.responsavel].join(' ')))
    .filter(p => !soPendentes || realPMP(p) < 100);
  return { tarefas, pmp };
}

// ---------------------------- VIEW: Indicadores --------------------------
function viewIND() {
  const N = 8;
  const weeks = Array.from({ length: N }, (_, i) => toKey(addDays(fromKey(ui.week), -7 * (N - 1 - i))));
  const serie = weeks.map(w => { const l = tarefasSemana(w); return { w, total: l.length, ok: l.filter(t => t.status === 'concluida').length, ppc: ppc(l) }; });
  const valid = serie.filter(s => s.ppc !== null);
  const media = valid.length ? Math.round(valid.reduce((a, s) => a + s.ppc, 0) / valid.length) : null;
  const atual = serie[serie.length - 1];

  const allPeriodo = tarefasObra().filter(t => weeks.includes(t.semana));
  const causas = {};
  allPeriodo.filter(t => t.causa && t.status !== 'concluida').forEach(t => causas[t.causa] = (causas[t.causa] || 0) + 1);
  const causasArr = Object.entries(causas).sort((a, b) => b[1] - a[1]);
  const maxC = causasArr[0]?.[1] || 1;
  const totC = causasArr.reduce((a, c) => a + c[1], 0);

  const group = (field) => {
    const m = {};
    tarefasSemana().filter(t => !t.naoPlanejada).forEach(t => { const k = t[field] || '(sem ' + field + ')'; m[k] = m[k] || { t: 0, ok: 0 }; m[k].t++; if (t.status === 'concluida') m[k].ok++; });
    return Object.entries(m).sort((a, b) => b[1].t - a[1].t);
  };
  const bars = (arr) => arr.length ? arr.map(([k, v]) => {
    const pc = Math.round(v.ok / v.t * 100);
    return `<div><div class="flex justify-between text-xs mb-1"><span class="font-semibold text-slate-700 truncate pr-2">${esc(k)}</span><span class="text-slate-500 whitespace-nowrap">${v.ok}/${v.t} · <b class="${pc >= 80 ? 'text-emerald-600' : pc >= 60 ? 'text-amber-600' : 'text-rose-600'}">${pc}%</b></span></div>
      <div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full ${pc >= 80 ? 'bg-emerald-500' : pc >= 60 ? 'bg-amber-500' : 'bg-rose-500'}" style="width:${pc}%"></div></div></div>`;
  }).join('') : '<div class="text-sm text-slate-400">Sem tarefas nesta semana.</div>';

  const card = (title, content, extra = '') => `<section class="rounded-2xl bg-white border border-slate-200 shadow-sm p-4 md:p-5 ${extra}"><h2 class="text-sm font-bold text-slate-800 mb-4">${title}</h2>${content}</section>`;

  const chart = `<div class="flex items-end gap-2 md:gap-3 h-52 pt-4 relative">
      <div class="absolute inset-x-0 border-t border-dashed border-emerald-400" style="bottom:calc(80% * 0.82 + 1.5rem)"><span class="absolute right-0 -top-4 text-[10px] font-bold text-emerald-600">meta 80%</span></div>
      ${serie.map(s => {
        const h = s.ppc === null ? 0 : s.ppc;
        const color = s.ppc === null ? 'bg-slate-200' : s.ppc >= 80 ? 'bg-emerald-500' : s.ppc >= 60 ? 'bg-amber-500' : 'bg-rose-500';
        const isSel = s.w === ui.week;
        return `<div class="flex-1 flex flex-col items-center justify-end h-full">
          <div class="text-[11px] font-bold ${s.ppc === null ? 'text-slate-300' : 'text-slate-700'} mb-1">${s.ppc === null ? '—' : s.ppc + '%'}</div>
          <div class="w-full max-w-[44px] rounded-t-md ${color} ${isSel ? 'ring-2 ring-offset-2 ring-gold' : ''}" style="height:calc(${h}% * 0.82)"></div>
          <div class="mt-1.5 text-[10px] font-semibold ${isSel ? 'text-gold-dark' : 'text-slate-400'} h-4">${fmtDM(fromKey(s.w))}</div>
        </div>`;
      }).join('')}
    </div>`;

  const pareto = causasArr.length ? `<div class="space-y-3">${causasArr.map(([c, n]) => `
      <div><div class="flex justify-between text-xs mb-1"><span class="font-semibold text-slate-700 pr-2">${esc(c)}</span><span class="text-slate-500 whitespace-nowrap">${n} · ${Math.round(n / totC * 100)}%</span></div>
      <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-rose-500" style="width:${n / maxC * 100}%"></div></div></div>`).join('')}</div>`
    : '<div class="text-sm text-slate-400">Nenhuma causa de não conclusão registrada no período. 👏</div>';

  const semNav = `<div class="flex items-center gap-1 rounded-xl bg-white border border-slate-200 p-1 shadow-sm">
      <button data-action="week-prev" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500">${ICON.chevL}</button>
      <button data-action="week-today" class="px-2 text-sm font-semibold text-slate-700">${weekLabel(ui.week)}</button>
      <button data-action="week-next" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500">${ICON.chevR}</button></div>`;

  return `<div class="p-4 md:p-8 max-w-[1600px] mx-auto fade-in">
    ${pageHeader('Indicadores', 'PPC — Percentual de Planos Concluídos · últimas 8 semanas até a semana selecionada', semNav)}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <div class="rounded-xl bg-white border border-slate-200 px-4 py-3 shadow-sm"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">PPC da semana</div><div class="text-2xl font-extrabold">${atual.ppc === null ? '—' : atual.ppc + '%'}</div></div>
      <div class="rounded-xl bg-white border border-slate-200 px-4 py-3 shadow-sm"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">PPC médio (8 sem.)</div><div class="text-2xl font-extrabold">${media === null ? '—' : media + '%'}</div></div>
      <div class="rounded-xl bg-white border border-slate-200 px-4 py-3 shadow-sm"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Tarefas no período</div><div class="text-2xl font-extrabold">${allPeriodo.length}</div></div>
      <div class="rounded-xl bg-white border border-slate-200 px-4 py-3 shadow-sm"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Causas registradas</div><div class="text-2xl font-extrabold ${totC ? 'text-rose-600' : ''}">${totC}</div></div>
    </div>
    <div class="grid gap-4 lg:grid-cols-2">
      ${card('Curva S — avanço físico da obra', curvaSChart(), 'lg:col-span-2')}
      ${card('Evolução do PPC semanal', chart, 'lg:col-span-2')}
      ${card('Causas de não conclusão (Pareto · 8 semanas)', pareto)}
      ${card('PPC por disciplina — semana selecionada', `<div class="space-y-3">${bars(group('disciplina'))}</div>`)}
      ${card('PPC por setor — semana selecionada', `<div class="space-y-3">${bars(group('setor'))}</div>`)}
      ${card('PPC por responsável — semana selecionada', `<div class="space-y-3">${bars(group('responsavel'))}</div>`)}
    </div>
  </div>`;
}


// ---------------------------- Curva S (Indicadores) ----------------------
const CS_COR = { prev: '#b8862b', real: '#0e7a3e' };
let CS_DATA = [];
function curvaSChart() {
  const itens = pmpObra();
  const cs = curvaS(itens);
  CS_DATA = cs;
  if (!cs.length) return `<div class="text-sm text-slate-400">Cadastre ou importe o cronograma no PMP para ver a curva S.</div>`;
  const n = cs.length;
  const X = i => n === 1 ? 50 : i / (n - 1) * 100;
  const pts = (key) => cs.map((p, i) => p[key] === null ? null : `${X(i) * 10},${100 - p[key]}`).filter(Boolean).join(' ');
  const hoje = currentWeek();
  const iHoje = cs.findIndex(p => p.w === hoje);
  const ultReal = [...cs].reverse().find(p => p.real !== null);
  const ptHoje = cs.filter(p => p.w <= hoje).pop();
  const step = Math.max(1, Math.ceil(n / 8));
  const xLabels = cs.map((p, i) => (i % step === 0 || i === n - 1) ? `<span class="absolute -translate-x-1/2 text-[10px] text-slate-400 whitespace-nowrap" style="left:${X(i)}%">${fmtDM(fromKey(p.w))}</span>` : '').join('');
  const grid = [0, 25, 50, 75, 100].map(v => `<div class="absolute inset-x-0 border-t ${v === 0 ? 'border-slate-300' : 'border-slate-100'}" style="bottom:${v}%"><span class="absolute -left-9 -translate-y-1/2 w-7 text-right text-[10px] text-slate-400">${v}%</span></div>`).join('');
  const desvio = ptHoje && ptHoje.real !== null ? Math.round(ptHoje.real - ptHoje.prev) : null;
  return `
    <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mb-5 text-xs text-slate-600">
      <span class="flex items-center gap-2"><svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="${CS_COR.prev}" stroke-width="2" stroke-dasharray="5 3"/></svg>Previsto (cronograma)</span>
      <span class="flex items-center gap-2"><svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="${CS_COR.real}" stroke-width="2.5"/></svg>Realizado (PCP)</span>
      ${desvio !== null ? `<span class="ml-auto text-slate-500">Hoje: realizado <b class="text-slate-800">${Math.round(ptHoje.real)}%</b> · previsto <b class="text-slate-800">${Math.round(ptHoje.prev)}%</b> · desvio <b class="${desvio < -5 ? 'text-rose-600' : desvio > 0 ? 'text-emerald-700' : 'text-slate-800'}">${desvio > 0 ? '+' : ''}${desvio} p.p.</b></span>` : ''}
    </div>
    <div class="pl-10 pr-2">
      <div id="cs-chart" class="relative h-56 touch-none cursor-crosshair">
        ${grid}
        ${iHoje >= 0 ? `<div class="absolute top-0 bottom-0 border-l border-dashed border-slate-400" style="left:${X(iHoje)}%"><span class="absolute -top-4 -translate-x-1/2 text-[10px] font-semibold text-slate-500">hoje</span></div>` : ''}
        <svg class="absolute inset-0 w-full h-full overflow-visible" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-label="Curva S: previsto e realizado">
          <polyline points="${pts('prev')}" fill="none" stroke="${CS_COR.prev}" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke" stroke-linejoin="round" />
          <polyline points="${pts('real')}" fill="none" stroke="${CS_COR.real}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        ${ultReal ? `<div class="absolute h-2.5 w-2.5 -translate-x-1/2 translate-y-1/2 rounded-full ring-2 ring-white" style="left:${X(cs.indexOf(ultReal))}%;bottom:${ultReal.real}%;background:${CS_COR.real}"></div>` : ''}
        <div id="cs-x" class="hidden absolute top-0 bottom-0 w-px bg-slate-400 pointer-events-none"></div>
        <div id="cs-dp" class="hidden absolute h-2.5 w-2.5 -translate-x-1/2 translate-y-1/2 rounded-full ring-2 ring-white pointer-events-none" style="background:${CS_COR.prev}"></div>
        <div id="cs-dr" class="hidden absolute h-2.5 w-2.5 -translate-x-1/2 translate-y-1/2 rounded-full ring-2 ring-white pointer-events-none" style="background:${CS_COR.real}"></div>
        <div id="cs-tip" class="hidden absolute z-10 -translate-x-1/2 rounded-lg bg-slate-900 text-white text-[11px] px-2.5 py-1.5 shadow-lg pointer-events-none whitespace-nowrap" style="top:-8px"></div>
        <div class="absolute inset-x-0 -bottom-5 h-4">${xLabels}</div>
      </div>
    </div>
    <details class="mt-8 text-xs">
      <summary class="cursor-pointer font-semibold text-slate-500">Ver tabela</summary>
      <div class="mt-2 max-h-56 overflow-y-auto rounded-lg border border-slate-100">
        <table class="w-full"><thead class="bg-slate-50 text-slate-500 sticky top-0"><tr><th class="text-left px-2 py-1.5">Semana</th><th class="text-right px-2">Previsto</th><th class="text-right px-2">Realizado</th><th class="text-right px-2">Desvio</th></tr></thead>
        <tbody class="divide-y divide-slate-100">${cs.map(p => `<tr><td class="px-2 py-1">${weekLabel(p.w)}</td><td class="text-right px-2">${p.prev.toFixed(1)}%</td><td class="text-right px-2">${p.real === null ? '—' : p.real.toFixed(1) + '%'}</td><td class="text-right px-2 ${p.real !== null && p.real - p.prev < -5 ? 'text-rose-600' : ''}">${p.real === null ? '' : (p.real - p.prev > 0 ? '+' : '') + (p.real - p.prev).toFixed(1)}</td></tr>`).join('')}</tbody></table>
      </div>
    </details>`;
}
function csHover(e) {
  const c = document.getElementById('cs-chart');
  if (!c) return;
  const inside = e.target.closest && e.target.closest('#cs-chart');
  const els = ['cs-x', 'cs-dp', 'cs-dr', 'cs-tip'].map(id => document.getElementById(id));
  if (!inside || !CS_DATA.length) { els.forEach(el => el.classList.add('hidden')); return; }
  const r = c.getBoundingClientRect(), n = CS_DATA.length;
  const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left) / r.width * (n - 1))));
  const p = CS_DATA[i], x = n === 1 ? 50 : i / (n - 1) * 100;
  const [lx, dp, dr, tip] = els;
  lx.style.left = x + '%'; lx.classList.remove('hidden');
  dp.style.left = x + '%'; dp.style.bottom = p.prev + '%'; dp.classList.remove('hidden');
  if (p.real !== null) { dr.style.left = x + '%'; dr.style.bottom = p.real + '%'; dr.classList.remove('hidden'); } else dr.classList.add('hidden');
  tip.innerHTML = `<b>Semana ${weekLabel(p.w)}</b><br>Previsto: ${p.prev.toFixed(1)}%${p.real !== null ? `<br>Realizado: ${p.real.toFixed(1)}%` : ''}`;
  tip.style.left = Math.max(12, Math.min(88, x)) + '%'; tip.style.transform = 'translate(-50%, -100%)';
  tip.classList.remove('hidden');
}
document.addEventListener('pointermove', csHover);
document.addEventListener('pointerdown', csHover);

function submitTask() {
  const form = $('#modal-root form[data-form="task"]');
  if (!form) return;
  if (!form.titulo.value.trim()) { form.titulo.focus(); form.titulo.classList.add('border-rose-400'); toast('Informe o nome da tarefa.'); return; }
  // Material digitado e não adicionado
  const pendNome = $('#dm-nome')?.value.trim();
  if (pendNome) addDraftMat();
  const d = ui.draft;
  const fd = new FormData(form);
  const semanaIn = fd.get('semana') || ui.week;
  Object.assign(d, {
    titulo: String(fd.get('titulo')).trim(),
    setor: upper(fd.get('setor')), disciplina: upper(fd.get('disciplina')), executante: upper(fd.get('executante')),
    responsavel: upper(fd.get('responsavel')), encarregado: upper(fd.get('encarregado')),
    status: fd.get('status'), causa: fd.get('causa') || '', obs: String(fd.get('obs') || '').trim(), pmpId: fd.get('pmpId') || '',
    semana: toKey(sundayOf(fromKey(semanaIn)))
  });
  if (!d.dias.some(v => v !== null)) { toast('Selecione ao menos um dia planejado.'); return; }
  if (d.causa && d.status !== 'concluida') d.status = 'impedida';
  if (!d.causa && d.status === 'impedida') d.status = 'andamento';
  if (d.status === 'concluida') d.causa = '';

  if (d.id) {
    const i = state.tarefas.findIndex(x => x.id === d.id);
    if (i >= 0) state.tarefas[i] = d;
    toast('Tarefa atualizada ✓');
  } else {
    d.id = uid(); state.tarefas.push(d);
    toast('Tarefa criada ✓');
  }
  save();
  if (d.semana !== ui.week) { ui.week = d.semana; }
  closeModal(); render();
}

}

function submitPmp() {
  PMP_IDX = null;
  const form = $('#modal-root form[data-form="pmp"]');
  const fd = new FormData(form);

  const inicio = fd.get('inicio'), fim = fd.get('fim');
  if (!etapa) { toast('Informe o nome da etapa.'); form.etapa.focus(); return; }
  if (!inicio || !fim) { toast('Informe início e término.'); return; }
  if (fim < inicio) { toast('O término deve ser igual ou posterior ao início.'); return; }
  const data = { etapa, setor: upper(fd.get('setor')), disciplina: upper(fd.get('disciplina')), responsavel: upper(fd.get('responsavel')), inicio, fim, manual: !fd.get('auto') };
  const id = form.dataset.id;
  const novoReal = Number(fd.get('progresso') || 0);
  const atual = id ? state.pmp.find(p => p.id === id) : null;
  // Se o % foi ajustado (ou mudou o modo), vira a nova base a partir de hoje
  if (!atual || novoReal !== avancoPMP(atual).real || data.manual !== !!atual.manual) { data.progresso = novoReal; data.baseData = todayKey(); }
  if (id) { Object.assign(atual, data); toast('Etapa atualizada ✓'); }
  else { state.pmp.push({ id: uid(), obraId: state.obraAtiva, ...data }); toast('Etapa criada ✓'); }
  save(); closeModal(); render();
}

function findTask(id) { return state.tarefas.find(t => t.id === id); }

function copyTaskTo(t, semana) {
  return Object.assign(JSON.parse(JSON.stringify(t)), {
    id: uid(), semana, status: 'nao_iniciada', causa: '',
    dias: t.dias.map(v => v === null ? null : 'p'),
    materiais: (t.materiais || []).map(m => ({ ...m, id: uid() }))
  });
}

function rollPending(fromWeek, toWeek) {
  const pend = tarefasSemana(fromWeek).filter(t => t.status !== 'concluida');
  const existing = new Set(tarefasSemana(toWeek).map(t => t.titulo.toLowerCase()));
  const novos = pend.filter(t => !existing.has(t.titulo.toLowerCase())).map(t => copyTaskTo(t, toWeek));
  state.tarefas.push(...novos);
  save();
  return { total: pend.length, criados: novos.length };
}

function exportCSV() {

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = XLSX_URL;
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxPromise = null; s.remove(); rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}

function buildImport() {
  const I = ui.imp, o = ui.impOpts, m = I.map;
  const get = (r, k) => (m[k] >= 0 ? r[m[k]] : '');
  const isEdt = m.nivel >= 0 && /edt|wbs|item/.test(norm(I.headers[m.nivel]));
  const recs = []; let invalid = 0;
  I.rows.slice(I.headerIdx + 1).forEach(r => {
    if (!r || r.every(c => String(c ?? '').trim() === '')) return;
    const raw = String(get(r, 'etapa') ?? '');
    const nome = raw.trim();
    if (!nome) { invalid++; return; }
    recs.push({
      nome, raw, ini: parseDateAny(get(r, 'inicio')), fim: parseDateAny(get(r, 'fim')),
      setor: upper(get(r, 'setor')), disc: upper(get(r, 'disciplina')), resp: upper(get(r, 'responsavel')),
      pct: parsePct(get(r, 'progresso')), lvl: m.nivel >= 0 ? parseLevel(get(r, 'nivel'), isEdt) : null
    });
  });

  if (m.nivel < 0) {
    const ind = recs.map(x => x.raw.match(/^\s*/)[0].length);
    if (ind.some(n => n > 0)) recs.forEach((x, i) => x.lvl = 1 + ind[i]);
  }
  recs.forEach((x, i) => { const nx = recs[i + 1]; x.summary = x.lvl != null && !!nx && nx.lvl != null && nx.lvl > x.lvl; });
  const stack = [];
  recs.forEach(x => {

    while (stack.length && stack[stack.length - 1].lvl >= x.lvl) stack.pop();
    x.parents = stack.map(s => s.nome);
    if (x.summary) stack.push(x);

// Cria as tarefas semanais (PCP) a partir das etapas do PMP.
// startKey = domingo inicial · weeks = nº de semanas (Infinity = todas) · dry = só conta
function gerarPCP(items, startKey, weeks, opts = state.prefs, dry = false) {
  PMP_IDX = null;
  const start = fromKey(startKey);
  const endLimit = weeks === Infinity ? null : addDays(start, 7 * weeks - 1);
  const existing = new Set(tarefasObra().map(t => t.semana + '|' + norm(t.titulo)));
  let n = 0;
  items.forEach(p => {
    if ((state.pmp.includes(p) ? realPMP(p) : Number(p.progresso)) >= 100) return;
    const a = fromKey(p.inicio), b = fromKey(p.fim);
    let w = sundayOf(a); if (w < start) w = new Date(start);
    while (w <= b && (!endLimit || w <= endLimit)) {
      const wk = toKey(w), key = wk + '|' + norm(p.etapa);
      if (!existing.has(key)) {
        const dias = DIAS.map((_, i) => {
          const d = addDays(w, i), dentro = d >= a && d <= b;
          const util = (i >= 1 && i <= 5) || (i === 6 && opts.sabado) || (i === 0 && opts.domingo);
          return dentro && util ? 'p' : null;

        if (!dias.some(Boolean)) DIAS.forEach((_, i) => { const d = addDays(w, i); if (d >= a && d <= b) dias[i] = 'p'; });
        if (!dry) state.tarefas.push({
          id: uid(), obraId: p.obraId || state.obraAtiva, semana: wk, titulo: p.etapa, setor: p.setor || '', disciplina: p.disciplina || '',
          executante: '', encarregado: '', responsavel: p.responsavel || '', status: 'nao_iniciada', dias, materiais: [], causa: '', obs: '', pmpId: p.id || ''
        });
        existing.add(key); n++;
      }
      w = addDays(w, 7);
    }
  });

async function handleCronogramaFile(file) {

    else if (ext === 'xml') sheets = { 'MS Project': parseMSPXml(decodeText(await file.arrayBuffer())) };
    else if (['xlsx', 'xls', 'xlsm', 'ods'].includes(ext)) {
      renderImport('Carregando leitor de Excel…');

      const wb = X.read(await file.arrayBuffer(), { type: 'array' });
      sheets = {};
      wb.SheetNames.forEach(n => { sheets[n] = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '', blankrows: false }); });
    } else if (ext === 'mpp') { renderImport('Arquivo .mpp não é lido pelo navegador — no MS Project salve como XML ou Excel'); return; }
    else { renderImport('Formato não suportado — use .xlsx, .xls, .csv ou .xml'); return; }

    const names = Object.keys(sheets).filter(n => sheets[n].length > 1);
    if (!names.length) { renderImport('O arquivo parece estar vazio'); return; }
    // aba com mais linhas de cronograma
    const best = names.slice().sort((a, b) => sheets[b].length - sheets[a].length)[0];
    ui.imp = { fileName: name, sheets };
    setSheet(best);
    renderImport();
  } catch (err) {
    ui.imp = null;
    renderImport(err.message === 'xlsx' ? 'Sem internet para carregar o leitor de Excel — salve a planilha como CSV e tente de novo'
      : err.message === 'xml' ? 'XML sem tarefas do MS Project' : 'Não foi possível ler o arquivo');
  }
}

function applyImport() {
  const { itens } = buildImport();
  if (!itens.length) return;
  const o = ui.impOpts, obraId = state.obraAtiva;
  let removidas = 0, preservadas = 0;
  if (o.modo === 'substituir' && pmpObra().length) {
    const oldIds = new Set(pmpObra().map(p => p.id));
    state.pmp = state.pmp.filter(p => p.obraId !== obraId);
    state.tarefas = state.tarefas.filter(t => {
      if (t.obraId !== obraId || !t.pmpId || !oldIds.has(t.pmpId)) return true;
      if (temExecucao(t)) { t.pmpId = ''; preservadas++; return true; }
      removidas++; return false;
    });
  }
  const novos = itens.map(i => ({ id: uid(), obraId, ...i }));
  // Re-vincula tarefas preservadas à nova etapa de mesmo nome
  const byName = new Map(novos.map(p => [norm(p.etapa), p.id]));
  state.tarefas.forEach(t => { if (t.obraId === obraId && !t.pmpId && byName.has(norm(t.titulo))) t.pmpId = byName.get(norm(t.titulo)); });
  state.pmp.push(...novos);
  let criadas = 0, startKey = importStartWeek(novos);
  if (o.gerarPCP) criadas = gerarPCP(novos, startKey, o.horizonte === 'all' ? Infinity : Number(o.horizonte));
  save(); closeModal();
  ui.view = 'pmp'; render();
  toast(`${novos.length} etapas no PMP${o.gerarPCP ? ` · ${criadas} tarefas no PCP` : ''}${preservadas ? ` · ${preservadas} com execução preservadas` : ''}`);
}

service cloud.firestore {

    function ativo() { return signedIn() && exists(/databases/$(database)/documents/users/$(request.auth.uid)) && perfil().ativo == true; }

    Cloud.fb = { ...appM, ...authM, ...fsM };

    catch (e) { Cloud.db = fsM.getFirestore(app); }

function cloudStopData() {
  [...Cloud.unsubData, ...Cloud.unsubObra].forEach(f => { try { f(); } catch (e) {} });

  Cloud.base = { obras: new Map(), pmp: new Map(), tarefas: new Map(), settings: '' };

async function onAuth(u) {
  Cloud.unsubs.forEach(f => { try { f(); } catch (e) {} }); Cloud.unsubs = [];
  cloudStopData();
  Cloud.user = u; Cloud.profile = null;
  if (!u) { showOverlay('login'); renderShell(); return; }
  showOverlay('loading', 'Entrando…');
  const F = Cloud.fb, ref = F.doc(Cloud.db, 'users', u.uid);
  try {
    const snap = await F.getDoc(ref);
    if (!snap.exists()) {
      const admin = ADMIN_EMAILS.map(e => e.toLowerCase()).includes((u.email || '').toLowerCase());
      await F.setDoc(ref, {
        nome: (Cloud.pendingNome || u.displayName || (u.email || '').split('@')[0]).trim(), email: u.email || '',
        papel: admin ? 'gestor' : 'pendente', ativo: admin, obras: [], criadoEm: Date.now()
      });
    }
  } catch (e) {
    console.error(e);
    // Sem internet: segue com o perfil guardado no aparelho (cache do Firestore)
    if (!(e?.code === 'unavailable' || !navigator.onLine)) {
      const admin = ADMIN_EMAILS.map(x => x.toLowerCase()).includes((u.email || '').toLowerCase());
      showOverlay('error', e?.code === 'permission-denied'
        ? `O Firestore recusou criar/ler o perfil de ${u.email}. Publique o arquivo firestore.rules mais recente em Firestore › Regras${admin ? ' (ele precisa conter o e-mail ' + u.email + ' como gestor)' : ''} e toque em “Tentar de novo”.`
        : errMsg(e));
      return;
    }
  }
  Cloud.unsubs.push(F.onSnapshot(ref, s => {
    const prevPapel = Cloud.profile?.papel;
    Cloud.profile = s.exists() ? { id: s.id, ...s.data() } : null;
    const liberado = Cloud.profile && Cloud.profile.ativo && ['gestor', 'encarregado'].includes(Cloud.profile.papel);
    if (!liberado) { cloudStopData(); showOverlay('pending'); renderShell(); return; }
    if (!Cloud.dataOn || prevPapel !== Cloud.profile.papel) { cloudStopData(); cloudStartData(); }
    else { ensureObraAtiva(); scheduleRender(); }
  }, e => showOverlay('error', errMsg(e))));
}

function cloudStartData() {
  Cloud.dataOn = true; Cloud.ready = false; Cloud.loaded = { obras: false, settings: false, obra: false };
  showOverlay('loading', 'Carregando obras…');
  const F = Cloud.fb, db = Cloud.db;
  const onErr = e => { console.error(e); showOverlay('error', errMsg(e)); };
  Cloud.unsubData.push(F.onSnapshot(F.collection(db, 'obras'), snap => {
    applySnap('obras', snap); Cloud.loaded.obras = true; ensureObraAtiva(); maybeReady();
  }, onErr));
  Cloud.unsubData.push(F.onSnapshot(F.doc(db, 'settings', 'geral'), s => {
    const d = s.exists() ? s.data() : {};
    state.causas = Array.isArray(d.causas) && d.causas.length ? d.causas : [...CAUSAS_PADRAO];
    state.prefs = Object.assign({ sabado: false, domingo: false }, d.prefs || {});
    Cloud.base.settings = settingsJSON(); Cloud.loaded.settings = true; maybeReady(); scheduleRender();
  }, onErr));
  if (isGestor()) Cloud.unsubData.push(F.onSnapshot(F.collection(db, 'users'), snap => {
    Cloud.users = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
    if (ui.view === 'cfg') scheduleRender();
  }, () => {}));
}

function applySnap(col, snap) {
  const docs = snap.docs.map(d => ({ ...d.data(), id: d.id }));
  state[col] = docs;
  Cloud.base[col] = new Map(docs.map(d => [d.id, JSON.stringify(d)]));
  scheduleRender();
}
function ensureObraAtiva() {
  const vis = obrasVisiveis();
  if (!vis.find(o => o.id === state.obraAtiva)) state.obraAtiva = vis[0]?.id || '';
  if (state.obraAtiva !== Cloud.listeningObra) listenObra();
}
function listenObra() {
  Cloud.unsubObra.forEach(f => { try { f(); } catch (e) {} }); Cloud.unsubObra = [];
  const id = state.obraAtiva; Cloud.listeningObra = id;
  state.pmp = []; state.tarefas = []; Cloud.base.pmp = new Map(); Cloud.base.tarefas = new Map();
  lsSet(LS_KEY + '-obra', id || '');
  if (!id) { Cloud.loaded.obra = true; maybeReady(); scheduleRender(); return; }
  Cloud.loaded.obra = false;
  const F = Cloud.fb, q = c => F.query(F.collection(Cloud.db, c), F.where('obraId', '==', id));
  const got = { pmp: false, tarefas: false };
  const onErr = e => { console.error(e); showOverlay('error', errMsg(e)); };
  const done = () => { if (got.pmp && got.tarefas && !Cloud.loaded.obra) { Cloud.loaded.obra = true; maybeReady(); setTimeout(checarRolagem, 400); } };
  Cloud.unsubObra.push(F.onSnapshot(q('pmp'), s => { if (Cloud.listeningObra !== id) return; applySnap('pmp', s); got.pmp = true; done(); }, onErr));
  Cloud.unsubObra.push(F.onSnapshot(q('tarefas'), { includeMetadataChanges: true }, s => {
    if (Cloud.listeningObra !== id) return;
    Cloud.pending = s.metadata.hasPendingWrites;
    applySnap('tarefas', s); got.tarefas = true; done(); renderSync();
  }, onErr));
}
function maybeReady() {
  if (Cloud.ready || !Cloud.loaded.obras || !Cloud.loaded.settings || !Cloud.loaded.obra) return;
  Cloud.ready = true; showOverlay(''); render();
}

// Re-render vindo da nuvem sem atrapalhar quem está digitando
let renderQueued = false;
function scheduleRender() {
  if (Cloud.enabled && !Cloud.ready) return;
  const ae = document.activeElement;
  if (ae && $('#main').contains(ae) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName)) { ui.pendingRender = true; return; }
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
document.addEventListener('focusout', () => setTimeout(() => { if (ui.pendingRender && !($('#main').contains(document.activeElement) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName))) render(); }, 60));

const settingsJSON = () => JSON.stringify({ causas: state.causas, prefs: state.prefs });

// Envia para a nuvem apenas o que mudou desde o último retrato recebido
function cloudPush() {
  if (!Cloud.ready) return;
  lsSet(LS_KEY + '-obra', state.obraAtiva || '');
  const ops = [];
  for (const col of ['obras', 'pmp', 'tarefas']) {
    const base = Cloud.base[col], seen = new Set();
    for (const d of state[col]) {
      seen.add(d.id);
      let j = JSON.stringify(d);
      if (base.get(d.id) !== j) {
        if (col === 'tarefas') { d.atualizadoPor = Cloud.profile?.nome || ''; d.atualizadoEm = Date.now(); j = JSON.stringify(d); }
        ops.push({ t: 'set', col, id: d.id, data: JSON.parse(j) });
        base.set(d.id, j);
      }
    }
    for (const id of [...base.keys()]) if (!seen.has(id)) { ops.push({ t: 'del', col, id }); base.delete(id); }
  }
  const sj = settingsJSON();
  if (sj !== Cloud.base.settings && isGestor()) { ops.push({ t: 'set', col: 'settings', id: 'geral', data: JSON.parse(sj) }); Cloud.base.settings = sj; }
  if (ops.length) commitOps(ops);
  if (state.obraAtiva !== Cloud.listeningObra) listenObra();
}
function commitOps(ops) {
  const F = Cloud.fb;
  Cloud.pending = true; renderSync();
  const chunks = [];
  for (let i = 0; i < ops.length; i += 450) chunks.push(ops.slice(i, i + 450));
  return Promise.all(chunks.map(ch => {
    const b = F.writeBatch(Cloud.db);
    ch.forEach(o => { const r = F.doc(Cloud.db, o.col, o.id); o.t === 'set' ? b.set(r, o.data) : b.delete(r); });
    return b.commit().catch(e => { console.error(e); toast(e.code === 'permission-denied' ? 'Sem permissão para esta alteração.' : 'Erro ao salvar na nuvem: ' + (e.code || e.message)); });
  })).then(() => { Cloud.pending = false; renderSync(); });
}
async function cloudDeleteObraData(obraId) {
  const F = Cloud.fb, ops = [];
  for (const c of ['tarefas', 'pmp']) {
    const s = await F.getDocs(F.query(F.collection(Cloud.db, c), F.where('obraId', '==', obraId)));
    s.docs.forEach(d => ops.push({ t: 'del', col: c, id: d.id }));
  }
  if (ops.length) commitOps(ops);
}
function localDataInfo() {
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return null;
    const d = JSON.parse(raw); if (!d || !Array.isArray(d.obras) || !d.obras.length) return null;
    return d;
  } catch (e) { return null; }
}
function cloudUploadAll(data) {
  const clean = o => JSON.parse(JSON.stringify(o));
  const ops = [];
  (data.obras || []).forEach(o => ops.push({ t: 'set', col: 'obras', id: o.id, data: clean(o) }));
  (data.pmp || []).forEach(o => ops.push({ t: 'set', col: 'pmp', id: o.id, data: clean(o) }));
  (data.tarefas || []).forEach(o => ops.push({ t: 'set', col: 'tarefas', id: o.id, data: clean(o) }));
  const causas = [...new Set([...(state.causas || []), ...(data.causas || [])])];
  ops.push({ t: 'set', col: 'settings', id: 'geral', data: { causas, prefs: Object.assign({}, state.prefs, data.prefs || {}) } });
  commitOps(ops);
  return ops.length;
}
function parseFbConfig(text) {
  const cfg = {};
  const re = /(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId|databaseURL)["']?\s*:\s*["']([^"']+)["']/g;
  let m; while ((m = re.exec(text))) cfg[m[1]] = m[2];
  return cfg.apiKey && cfg.projectId && cfg.appId ? cfg : null;
}

const GESTOR_ONLY = new Set(['np-ok', 'np-del', 'antecipar', 'new-task', 'edit-task', 'dup-task', 'del-task', 'submit-task', 'roll-pending', 'copy-prev-week', 'pull-week',

document.addEventListener('click', (e) => {

    return;
  }

  switch (a) {
    // --- Nuvem / login ---
    case 'auth-toggle': showOverlay(Cloud.overlay === 'signup' ? 'login' : 'signup'); break;
    case 'auth-reset': {
      const email = $('#auth-root input[name="email"]')?.value.trim();
      if (!email) { showOverlay('login', 'Digite seu e-mail acima e toque em “Esqueci a senha”.'); break; }
      Cloud.fb.sendPasswordResetEmail(Cloud.auth, email)
        .then(() => { showOverlay('login'); toast('Enviamos um link para redefinir a senha.'); })
        .catch(err => showOverlay('login', errMsg(err)));
      break;
    }
    case 'logout': closeModal(); Cloud.fb?.signOut(Cloud.auth); break;
    case 'cloud-retry': location.reload(); break;

    case 'cloud-migrate': {

      cloudUploadAll(d);
      try { localStorage.setItem(LS_KEY + '-migrado', localStorage.getItem(LS_KEY)); localStorage.removeItem(LS_KEY); } catch (err) {}
      toast('Dados enviados para a nuvem ✓'); scheduleRender();
      break;
    }
    case 'show-rules': openRulesModal(); break;
    case 'copy-rules':
      navigator.clipboard?.writeText(FIRESTORE_RULES).then(() => toast('Regras copiadas ✓'), () => toast('Selecione o texto e copie manualmente.'));

    case 'import-crono': if (!obraAtual()) { openObraModal(); break; } openImportModal(); break;
    case 'imp-template': downloadTemplate(); break;
    case 'imp-apply': applyImport(); break;
    case 'imp-reset': ui.imp = null; renderImport(); break;

    case 'antecipar': anteciparHoje(id); break;
    case 'edit-task': openTaskModal(findTask(id)); break;
    case 'submit-task': submitTask(); break;
    case 'close-modal': closeModal(); break;

    case 'week-prev': ui.week = toKey(addDays(fromKey(ui.week), -7)); render(); break;
    case 'week-next': ui.week = toKey(addDays(fromKey(ui.week), 7)); render(); break;

    case 'toggle-filters': ui.showFilters = !ui.showFilters; render(); break;
    case 'clear-filters': Object.keys(ui.filters).forEach(k => ui.filters[k] = ''); render(); break;
    case 'print': window.print(); break;

    case 'cycle-day': {
      const t = findTask(id); const i = Number(el.dataset.day);
      const next = { p: 'ok', ok: 'x', x: 'p' };
      t.dias[i] = next[t.dias[i]] || 'p';
      const before = t.status;
      autoStatus(t); save(); render();

    case 'roll-pending': {
      const nw = toKey(addDays(fromKey(ui.week), 7));
      const r = rollPending(ui.week, nw);
      if (!r.total) toast('Não há tarefas pendentes nesta semana.');
      else { toast(`${r.criados} tarefa(s) levada(s) para ${weekLabel(nw)}${r.total - r.criados ? ` · ${r.total - r.criados} já existiam` : ''}`); render(); }
      break;
    }
    case 'copy-prev-week': {
      const pw = toKey(addDays(fromKey(ui.week), -7));
      const r = rollPending(pw, ui.week);
      toast(r.criados ? `${r.criados} tarefa(s) trazida(s) da semana anterior` : 'Nenhuma pendência na semana anterior.');
      render(); break;
    }

    case 'toggle-plan': {
      const i = Number(el.dataset.day);
      ui.draft.dias[i] = ui.draft.dias[i] === null ? 'p' : null;
      $('#plan-days').innerHTML = planDaysHTML();
      break;
    }
    case 'draft-add-mat': addDraftMat(); break;
    case 'draft-del-mat': ui.draft.materiais = ui.draft.materiais.filter(m => m.id !== el.dataset.mat); $('#draft-mats').innerHTML = draftMatsHTML(); break;

    case 'new-pmp': openPmpModal(); break;
    case 'edit-pmp': openPmpModal(state.pmp.find(p => p.id === id)); break;
    case 'submit-pmp': submitPmp(); break;
    case 'del-pmp':
      if (confirm('Excluir esta etapa do PMP? As tarefas vinculadas serão mantidas, sem vínculo.')) {
        state.pmp = state.pmp.filter(p => p.id !== id);
        state.tarefas.forEach(t => { if (t.pmpId === id) t.pmpId = ''; });
        save(); closeModal(); render(); toast('Etapa excluída');
      }
      break;
    case 'pull-pmp': {
      const p = state.pmp.find(x => x.id === id);
      closeModal();
      openTaskModal(null, { titulo: p.etapa, setor: p.setor, disciplina: p.disciplina, responsavel: p.responsavel, pmpId: p.id, semana: ui.week });
      break;
    }

    case 'new-obra': openObraModal(); break;
    case 'edit-obra': openObraModal(state.obras.find(o => o.id === id)); break;
    case 'del-obra': {
      const o = state.obras.find(x => x.id === id);
      const typed = prompt(`Esta ação apaga a obra "${o.nome}" com TODAS as tarefas e etapas do PMP.\n\nDigite o nome da obra para confirmar:`);
      if (typed === null) break;
      if (upper(typed) !== upper(o.nome)) { toast('Nome não confere. Nada foi apagado.'); break; }
      state.obras = state.obras.filter(x => x.id !== id);
      state.tarefas = state.tarefas.filter(t => t.obraId !== id);
      state.pmp = state.pmp.filter(p => p.obraId !== id);
      if (state.obraAtiva === id) state.obraAtiva = state.obras[0]?.id || '';
      if (Cloud.enabled) cloudDeleteObraData(id);
      save(); render(); toast('Obra excluída');
      break;
    }
    case 'del-causa': state.causas.splice(Number(el.dataset.idx), 1); save(); render(); break;

    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-json': $('#import-file').click(); break;
    case 'reset':
      if (confirm('Apagar TODOS os dados deste dispositivo? Recomendo exportar um backup antes.')) {
        state = { versao: 1, obras: [], obraAtiva: '', tarefas: [], pmp: [], causas: [...CAUSAS_PADRAO] };
        save(); render(); toast('Dados apagados');
      }
      break;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('[data-filter]') && el.tagName === 'SELECT') { ui.filters[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.pref) {
    state.prefs[el.dataset.pref] = el.checked; save();
    if (el.dataset.pref === 'rolagemAuto' && el.checked) checarRolagem();
    return;
  }
  if (el.id === 'qs-pend') { ui.qs.soPend = el.checked; renderQuickResults(); return; }
  // --- Usuários (gestor) ---
  if (el.dataset.userField) {
    const v = el.type === 'checkbox' ? el.checked : el.value;
    const data = { [el.dataset.userField]: v };
    if (el.dataset.userField === 'papel' && v !== 'pendente') data.ativo = true;
    if (el.dataset.userField === 'papel' && v === 'pendente') data.ativo = false;
    updateUser(el.dataset.user, data); return;
  }
  if (el.dataset.userObra) {
    const u = Cloud.users.find(x => x.id === el.dataset.user); if (!u) return;
    const set = new Set(u.obras || []); el.checked ? set.add(el.dataset.userObra) : set.delete(el.dataset.userObra);
    updateUser(u.id, { obras: [...set] }); return;
  }
  // --- Importação de cronograma ---
  if (el.id === 'imp-file') { handleCronogramaFile(el.files[0]); return; }
  if (el.id === 'imp-sheet') { setSheet(el.value); renderImport(); return; }
  if (el.id === 'imp-header') { setHeaderRow((parseInt(el.value, 10) || 1) - 1); renderImport(); return; }
  if (el.dataset.impMap) { ui.imp.map[el.dataset.impMap] = Number(el.value); renderImport(); return; }
  if (el.dataset.impOpt) { const k = el.dataset.impOpt; ui.impOpts[k] = el.type === 'checkbox' ? el.checked : el.value; renderImport(); return; }
  if (el.dataset.impPref) { state.prefs[el.dataset.impPref] = el.checked; save(); renderImport(); return; }
  if (el.name === 'semana' && ui.draft) {
    ui.draft.semana = el.value || ui.week;
    $('#semana-hint').textContent = 'Semana: ' + weekLabel(toKey(sundayOf(fromKey(ui.draft.semana))));
    $('#plan-days').innerHTML = planDaysHTML();
    return;
  }
  const a = el.dataset.action; if (!a) return;
  const id = el.dataset.id;
  if (a === 'select-obra') { state.obraAtiva = el.value; Object.keys(ui.filters).forEach(k => ui.filters[k] = ''); save(); render(); if (!Cloud.enabled) checarRolagem(); toast('Obra: ' + (obraAtual()?.nome || '')); }
  if (a === 'set-status') {
    const t = findTask(id); t.status = el.value;
    if (t.status === 'concluida') { t.causa = ''; t.dias = t.dias.map(v => v === null ? null : 'ok'); }
    if (t.status !== 'impedida' && t.status !== 'concluida' && t.causa) t.causa = '';
    save(); render();
  }
  if (a === 'set-causa') {
    const t = findTask(id); t.causa = el.value;
    if (t.causa && t.status !== 'concluida') t.status = 'impedida';
    if (t.causa && t.status === 'concluida') { t.status = 'impedida'; }
    if (!t.causa && t.status === 'impedida') t.status = t.dias.some(v => v === 'ok' || v === 'x') ? 'andamento' : 'nao_iniciada';
    save(); render();
    if (t.causa) toast('Impedimento registrado');
  }
  if (a === 'toggle-mat') {
    const t = findTask(id); const m = t.materiais.find(x => x.id === el.dataset.mat);
    m.ok = el.checked; save(); render();
  }
});

    const email = f.email.value.trim(), senha = f.senha.value;

    if (kind === 'signup') Cloud.pendingNome = f.nome.value.trim();
    // Continuar conectado = sessão guardada no aparelho; desmarcado = sai ao fechar o navegador
    F.setPersistence(Cloud.auth, lembrar ? F.browserLocalPersistence : F.browserSessionPersistence)
      .then(() => kind === 'login' ? F.signInWithEmailAndPassword(Cloud.auth, email, senha)
        : F.createUserWithEmailAndPassword(Cloud.auth, email, senha).then(c => F.updateProfile(c.user, { displayName: Cloud.pendingNome }).catch(() => {})))
      .catch(err => showOverlay(kind, errMsg(err)));
    return;
  }
  if (kind === 'fbconfig') {
    const cfg = parseFbConfig(f.cfg.value);
    if (!cfg) { toast('Não reconheci o firebaseConfig. Cole o bloco inteiro copiado do Firebase.'); return; }
    lsSet(LS_KEY + '-firebase', JSON.stringify(cfg));
    toast('Conectando à nuvem…'); setTimeout(() => location.reload(), 400);
    return;
  }
  if (kind === 'np') { submitNP(); return; }
  if (kind === 'task') submitTask();
  else if (kind === 'pmp') submitPmp();
  else if (kind === 'add-mat') {
    const t = findTask(f.dataset.id);
    const nome = f.nome.value.trim(); if (!nome) return;
    t.materiais = t.materiais || [];
    t.materiais.push({ id: uid(), nome, qtd: f.qtd.value.trim(), un: f.un.value.trim(), ok: false });
    save(); render();
    const nf = document.querySelector(`form[data-form="add-mat"][data-id="${t.id}"] input[name="nome"]`); if (nf) nf.focus();
  } else if (kind === 'add-causa') {
    const c = f.causa.value.trim();
    if (c && !state.causas.includes(c)) { state.causas.push(c); save(); render(); }
  } else if (kind === 'obra') {
    const nome = upper(f.nome.value); if (!nome) return;
    const id = f.dataset.id;
    if (id) { const o = state.obras.find(x => x.id === id); o.nome = nome; o.endereco = f.endereco.value.trim(); toast('Obra atualizada ✓'); }
    else { const o = { id: uid(), nome, endereco: f.endereco.value.trim() }; state.obras.push(o); state.obraAtiva = o.id; ui.view = ui.view === 'cfg' ? 'cfg' : 'pcp'; toast('Obra criada ✓'); }
    save(); closeModal(); render();
  }
});

// Enter no campo de material do modal adiciona o item (em vez de enviar o formulário)
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
  // Ctrl+K / ⌘K ou "/" abre a busca rápida
  const digitando = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !digitando)) {
    if (!$('#auth-root').innerHTML && (!Cloud.enabled || Cloud.ready)) { e.preventDefault(); openQuickSearch(); }
  }
  if (e.key === 'Enter' && e.target.id === 'qs-input') { const first = document.querySelector('#qs-results [data-action="qs-go"], #qs-results [data-action="qs-pmp"]'); if (first) { e.preventDefault(); first.click(); } }
  if (e.key === 'Enter' && ['dm-nome', 'dm-qtd', 'dm-un'].includes(e.target.id)) { e.preventDefault(); addDraftMat(); }
});

// Arrastar e soltar o cronograma
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('#imp-drop'); if (z) { e.preventDefault(); z.classList.add('border-gold'); } });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('#imp-drop'); if (z) z.classList.remove('border-gold'); });
document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('#imp-drop'); if (z) { e.preventDefault(); handleCronogramaFile(e.dataTransfer.files[0]); } });

$('#import-file').addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.obras) || !Array.isArray(data.tarefas)) throw new Error('formato');
      if (Cloud.enabled) {
        if (!confirm(`Enviar para a nuvem o backup com ${data.obras.length} obra(s), ${(data.pmp || []).length} etapa(s) e ${data.tarefas.length} tarefa(s)? Itens com o mesmo código serão sobrescritos; os demais dados da nuvem são mantidos.`)) return;
        cloudUploadAll(data); toast('Backup enviado para a nuvem ✓'); return;
      }
      if (!confirm(`Importar backup com ${data.obras.length} obra(s) e ${data.tarefas.length} tarefa(s)? Os dados atuais deste dispositivo serão substituídos.`)) return;
      data.pmp = data.pmp || []; data.causas = data.causas || [...CAUSAS_PADRAO]; data.prefs = Object.assign({ sabado: false, domingo: false }, data.prefs || {});
      if (!data.obras.find(o => o.id === data.obraAtiva)) data.obraAtiva = data.obras[0]?.id || '';
      state = data; save(); render(); toast('Backup importado ✓');
    } catch (err) { toast('Arquivo inválido. Use um backup exportado por este app.'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

// Sincroniza entre abas do mesmo navegador
window.addEventListener('storage', (e) => { if (!Cloud.enabled && e.key === LS_KEY) { const s = load(); if (s) { state = s; render(); } } });

window.addEventListener('online', renderSync);
window.addEventListener('offline', renderSync);

if (Cloud.enabled) cloudInit();
render();
if (!Cloud.enabled) setTimeout(checarRolagem, 300);
</script>
</body>
</html>
